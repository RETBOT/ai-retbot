# ============================================
# RETBOT - Producción Simple (Sin build)
# ============================================
# Usa imagen pre-construida o build local
# ============================================

version: '3.8'

services:
  # ============================================
  # API - Servidor FastAPI
  # ============================================
  api:
    image: python:3.11-slim
    container_name: retbot-api
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      # Montar código fuente
      - .:/app
      # Datos persistentes
      - ./data:/app/data
      # Logs
      - ./logs:/app/logs
      # Web UI
      - ./web:/app/web
    environment:
      # Servidor
      - PORT=8000
      
      # Modelo (CPU-only)
      - MODEL_NAME=qwen2.5-coder:3b
      - MODEL_TYPE=ollama
      # Ollama corre como servicio de este compose (portable en cualquier VPS)
      # Si prefieres usar el Ollama del HOST (no Docker), cambia a:
      #   OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_URL=http://ollama:11434
      
      # Redis (cache)
      - REDIS_URL=redis://redis:6379
      
      # Concurrencia (CPU)
      - OLLAMA_CONTEXT_LENGTH=4096
      
      # Rate limiting
      - RATE_LIMIT_PER_USER=20
      - RATE_LIMIT_PER_MINUTE=10
      - RATE_LIMIT_ENABLED=true
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      
      # CORS
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      
      # Seguridad (del archivo .env)
      - ADMIN_PASSWORD
      - SECRET_KEY
      - API_KEY
    env_file:
      - .env
    # Solo necesario si usas OLLAMA_URL=http://host.docker.internal:11434
    # (Ollama corriendo en el host, no en Docker)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python server.py"
    restart: unless-stopped
    networks:
      - retbot-network

  # ============================================
  # Ollama - Modelos de IA locales
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: retbot-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - retbot-network
    # Nota: GPU se configura automáticamente via script deploy.sh
    # Si tienes GPU NVIDIA, ejecuta: ./deploy.sh --with-gpu

  # ============================================
  # Redis - Cache de respuestas
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: retbot-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - retbot-network

networks:
  retbot-network:
    driver: bridge

volumes:
  redis_data:
  ollama_data:

# ============================================
# INSTRUCCIONES
# ============================================
#
# 1. Primera vez:
#    cp .env.example .env
#    vi .env  # Configurar ADMIN_PASSWORD
#    docker-compose -f docker-compose.prod.simple.yml up -d
#
# 2. Ver logs:
#    docker-compose -f docker-compose.prod.simple.yml logs -f api
#
# 3. Health check:
#    curl http://localhost:8000/health
#
# 4. Web UI:
#    http://TU_IP:8000/admin/ui
#
# ============================================
