# ============================================
# RETBOT - Docker Compose para Desarrollo
# ============================================
# Para producción con GPUs, usar docker-compose.gpu.yml
# ============================================

version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data.db:/app/data.db
      - ./api:/app/api
      - ./core:/app/core
    environment:
      - PORT=8000
      # Modelo para CPU (cambiar cuando tengas GPU)
      - MODEL_NAME=qwen2.5-coder:3b
      - MODEL_TYPE=ollama
      # En desarrollo, Ollama corre en host
      - OLLAMA_URL=http://host.docker.internal:11434
      - OPENCODE_URL=http://localhost:54321
    env_file:
      - .env
    extra_hosts:
      # Para que el contenedor pueda acceder a Ollama en el host
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

