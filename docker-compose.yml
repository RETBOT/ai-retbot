version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
      - "4010:4010"
      - "11434:11434"
    volumes:
      - ./data.db:/app/data.db
      - ./api:/app/api
      - ./core:/app/core
    environment:
      - PORT=8000
      - MODEL_NAME=qwen:0.5b
      - MODEL_TYPE=ollama
      - OLLAMA_URL=http://127.0.0.1:11434
      - OPENCODE_URL=http://localhost:54321
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s